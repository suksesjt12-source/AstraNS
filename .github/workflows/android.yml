name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-tests:
    name: Native AArch64 tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run native tests
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pedantic \
            -I app/src/main/cpp \
            app/src/main/cpp/arm64_interpreter.cpp \
            app/src/main/cpp/nro_loader.cpp \
            app/src/main/cpp/nso_loader.cpp \
            app/src/main/cpp/mod0_relocator.cpp \
            app/src/main/cpp/guest_address_space.cpp \
            app/src/test/cpp/arm64_interpreter_test.cpp \
            -o "$RUNNER_TEMP/astrans-native-tests"
          "$RUNNER_TEMP/astrans-native-tests"

  build:
    name: Build Android APK
    needs: native-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform, NDK and CMake
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstraNS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
